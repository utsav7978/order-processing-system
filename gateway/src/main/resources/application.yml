server:
  port: 8080

spring:
  application:
    name: gateway
  cloud:
    gateway:
      routes:
        # Route definitions are added in Phase 7 (Gateway phase).
        # Left empty here so the skeleton starts and compiles cleanly.
        - id: placeholder-route
          uri: http://localhost:8080
          predicates:
            - Path=/actuator/**

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    org.springframework.cloud.gateway: INFO
