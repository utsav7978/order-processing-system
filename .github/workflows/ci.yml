name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:

  build-and-test:
    name: Build & Test (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - gateway
          - user-service
          - product-service
          - order-service
          - notification-service

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
          cache-dependency-path: ${{ matrix.service }}/pom.xml

      - name: Build, test, and package
        working-directory: ${{ matrix.service }}
        run: mvn -B clean verify

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.service }}
          path: ${{ matrix.service }}/target/surefire-reports/
          retention-days: 7

      - name: Upload built jar
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: jar-${{ matrix.service }}
          path: ${{ matrix.service }}/target/*.jar
          retention-days: 7

  docker-build:
    name: Verify Docker images build (${{ matrix.service }})
    runs-on: ubuntu-latest
    needs: build-and-test
    strategy:
      fail-fast: false
      matrix:
        service:
          - gateway
          - user-service
          - product-service
          - order-service
          - notification-service

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image (build only - no push, no deploy)
        run: docker build -t order-processing-system/${{ matrix.service }}:ci ./${{ matrix.service }}
